<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pitapixel — Client Photo Delivery</title>
    <meta name="description" content="Minimal, fast photo delivery platform for photographers to share client galleries through private links." />
    <meta property="og:title" content="Pitapixel — Client Photo Delivery" />
    <meta property="og:description" content="Minimal, fast photo delivery platform for photographers to share client galleries through private links." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Suppress benign Vite HMR WebSocket closing notices in sandboxed iframe environment
      window.addEventListener('unhandledrejection', function (event) {
        if (
          event.reason &&
          typeof event.reason.message === 'string' &&
          (event.reason.message.includes('WebSocket') || event.reason.message.includes('websocket'))
        ) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function (event) {
        if (
          event.message &&
          (event.message.includes('WebSocket') || event.message.includes('websocket') || event.message.includes('[vite] failed to connect'))
        ) {
          event.preventDefault();
        }
      });
    </script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
